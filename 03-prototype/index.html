<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warmly - Prototipo</title>
<style>
:root{--blue:#1F4E79;--blue2:#2E75B6;--bg:#F4F6F9;--card:#fff;--line:#E1E6ED;--txt:#1E2A36;--mut:#6B7785;--ok:#2E7D32;--warn:#B26A00;--bad:#C0392B;--sun:#F2A900}
*{box-sizing:border-box}body{margin:0;font-family:"Carlito","Calibri","Segoe UI",Arial,sans-serif;color:var(--txt);background:var(--bg);font-size:14px}
a{color:var(--blue2);text-decoration:none}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--blue);color:#fff;padding:18px 0}
.brand{display:flex;align-items:center;gap:8px;padding:0 18px 18px;font-weight:700;font-size:20px}
.brand .dot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFD34D,var(--sun));box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.75}
.nav a{display:flex;gap:10px;align-items:center;color:#D6E4F2;padding:9px 18px;font-size:14px}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;border-left:3px solid var(--sun);padding-left:15px}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;padding:14px 18px 4px}
.main{display:flex;flex-direction:column}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.search{width:360px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--mut);background:#FAFBFC}
.user{display:flex;align-items:center;gap:10px;color:var(--mut)}
.av{width:32px;height:32px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.content{padding:20px 22px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:14px}.col{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:15px}
.kpi .v{font-size:26px;font-weight:700;color:var(--blue)}.kpi .l{color:var(--mut);font-size:12px}
.kpi .d{font-size:12px;color:var(--ok)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:8px}
td{padding:9px 8px;border-bottom:1px solid #EEF1F5}
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.b.n{background:#E3F0FB;color:var(--blue2)}.b.q{background:#E7F5E8;color:var(--ok)}.b.w{background:#FFF3DC;color:var(--warn)}.b.r{background:#FDE7E4;color:var(--bad)}.b.g{background:#EEF1F5;color:var(--mut)}
.btn{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;border:0;font-size:13px}
.btn.s{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.y{background:var(--sun);color:#1E2A36}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.filters{display:flex;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--mut)}.chip.on{border-color:var(--blue2);color:var(--blue2);background:#EEF5FC}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.inp{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;min-height:38px}
.inp.req::after{content:"";}
.alert{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}.alert.w{background:#FFF7E6;border:1px solid #F5D08A}.alert.r{background:#FDECEA;border:1px solid #F3B5AE}.alert.i{background:#EEF5FC;border:1px solid #BCD7F0}
.kan{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.colk{background:#EBEFF4;border-radius:10px;padding:8px;min-height:520px}
.colk h4{margin:2px 4px 8px;font-size:12px;display:flex;justify-content:space-between;color:#3A4756}
.tc{background:#fff;border-radius:8px;padding:9px;margin-bottom:8px;border:1px solid var(--line);font-size:12px}
.tc b{display:block;font-size:13px;margin-bottom:3px}.tc .m{color:var(--mut);display:flex;justify-content:space-between;margin-top:5px}
.tc.drag{transform:rotate(-2deg);box-shadow:0 8px 18px rgba(0,0,0,.18);border-color:var(--blue2)}
.steps{display:flex;gap:0;margin:6px 0 16px}.st{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative;padding-top:22px}
.st::before{content:"";position:absolute;top:6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#D5DCE4}
.st::after{content:"";position:absolute;top:12px;left:calc(50% + 9px);right:calc(-50% + 9px);height:2px;background:#D5DCE4}.st:last-child::after{display:none}
.st.done::before{background:var(--ok)}.st.done::after{background:var(--ok)}.st.cur::before{background:var(--sun);box-shadow:0 0 0 4px #FFE9B0}.st.cur{color:var(--txt);font-weight:700}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{position:relative;margin-bottom:12px;font-size:13px}.tl div::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue2)}
.tl small{color:var(--mut);display:block}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}.chart div{flex:1;background:var(--blue2);border-radius:4px 4px 0 0;position:relative}.chart span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.funnel div{height:30px;margin:0 auto 6px;background:var(--blue2);color:#fff;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .l{background:linear-gradient(150deg,var(--blue),#163A5C);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center}
.login .r{display:grid;place-items:center}.login .box{width:360px}
/* mobile */
.phone{width:390px;min-height:844px;background:var(--bg);margin:0 auto;display:flex;flex-direction:column}
.mtop{background:var(--blue);color:#fff;padding:14px 16px 16px}.mtop h2{margin:4px 0 0;font-size:20px}.mtop small{opacity:.8}
.mbody{padding:14px;flex:1}.mnav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--mut);padding:8px 0 18px}.mnav .on{color:var(--blue);font-weight:700}
.mi{display:block;font-size:18px;margin-bottom:2px}
.li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px}.li b{display:block}.li small{color:var(--mut)}
.fab{position:fixed}
</style></head><body><div id="root"></div>
<script>
